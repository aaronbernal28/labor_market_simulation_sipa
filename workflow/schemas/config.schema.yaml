$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Validation schema for labor_market_simulation_sipa configuration"
type: object
required:
  - paths
  - pipeline
  - simulation
  - datasets
properties:
  paths:
    type: object
    required:
      - data_raw
      - data_parquet
      - data_processed
      - data_graphs
      - images
    properties:
      data_raw:
        type: string
      data_parquet:
        type: string
      data_processed:
        type: string
      data_graphs:
        type: string
      images:
        type: string
  pipeline:
    type: object
    required:
      - start_period
      - end_period
      - time_interval
      - granularity
      - include_unemployment_node
      - transition_metric
      - max_working_age
      - weight_column
    properties:
      start_period:
        type: integer
      end_period:
        type: integer
      time_interval:
        type: integer
      granularity:
        type: integer
        enum: [1, 2, 3, 4]
      include_unemployment_node:
        type: boolean
      transition_metric:
        type: string
        enum: ["hidalgo", "row_stochastic"]
      max_working_age:
        type: integer
      weight_column:
        type: ["string", "null"]
  simulation:
    type: object
    required:
      - n_agents
      - agent_sample_size
      - exp_a_shock_fraction
      - exp_b_target_sector
      - exp_b_reduction_fraction
      - seed
    properties:
      n_agents:
        type: integer
        minimum: 1
      agent_sample_size:
        type: integer
        minimum: 1
      exp_a_shock_fraction:
        type: number
        minimum: 0.0
        maximum: 1.0
      exp_b_target_sector:
        type: string
      exp_b_reduction_fraction:
        type: number
        minimum: 0.0
        maximum: 1.0
      seed:
        type: integer
    additionalProperties: false
  datasets:
    type: object
    required:
      - sipa
    properties:
      features:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
      sipa:
        type: object
        required:
          - source
        properties:
          source:
            type: string
          url:
            type: string
          id_1:
            type: string
          id_2:
            type: string
          id_3:
            type: string
  translation:
    type: object
