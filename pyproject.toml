[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labor_market_simulation_sipa"
version = "0.1.0"
description = "Simulation of the labor market based on SIPA and occupational networks in Argentina"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"Jinja2==3.1.6",
	"matplotlib==3.11.2",
	"mesa==3.5.1",
	"networkx==3.7",
	"numpy==2.5.4",
	"pandas==3.1.0",
	"pyarrow==26.0.0",
	"python-dotenv==1.2.4",
	"python-telegram-bot==22.8",
	"scikit-learn==1.9.1",
	"scipy==1.18.1",
	"seaborn==0.13.2",
	"weasyprint==70.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
