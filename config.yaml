paths:
  data_raw: data
  data_parquet: data/processed/mler_parquet
  data_processed: data/processed
  data_graphs: data/graphs
  images: images

pipeline:
  # Time range of the full dataset (YYYYMM)
  start_period: 199601
  end_period:   202112

  # Width of each time batch (in months).  e.g. 12 = annual batches.
  time_interval: 12

  # Sector granularity: 1=letra | 2=r32 two-digit | 3=r32 first digit | 4=r34
  granularity: 2

  # Whether workers absent in the next batch route to an "unemployed" node
  include_unemployment_node: true

  # Transition / proximity metric: "hidalgo" (default) or "row_stochastic"
  transition_metric: "hidalgo"

  # Maximum working age cutoff (workers older than this exit the active pool)
  max_working_age: 65

  # Weighting column (set to null to disable, or "pondera")
  weight_column: "pondera"

# ── Simulation parameters (Mesa 3.5.1 ABM) ─────────────────────────────────────
# 1 step = 1 continuous batch (pipeline.time_interval months); steps = len(BATCHES).
simulation:
  n_agents: 10000                     # simulated worker population (fixed)
  agent_sample_size: 100              # sample of agents tracked in agent trajectory CSV
  exp_a_shock_fraction: 0.20          # Exp A: fraction of employed workers moved to unemployed
  exp_b_target_sector: "auto"         # Exp B: sector code or "auto" = largest formal sector
  exp_b_reduction_fraction: 0.50      # Exp B: contraction fraction of target sector
  seed: 42

datasets:
  features:
    - name: "sex_id"
      type: "int"


  sipa:
    source: data/MLER.csv
    url: "https://datasets.datos.mincyt.gob.ar/dataset/b0c0ae96-4028-4d0e-919a-c6830110f6b6/resource/421a7e29-7d15-4b69-a2e8-d7242b58b770/download/base_enespersonas.csv"
    id_1: "nocues"
    id_2: "nhog"
    id_3: "miembro"

